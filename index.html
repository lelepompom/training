<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App - GitHub Pages</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        .header { display: flex; justify-content: space-between; color: #666; font-size: 0.9rem; margin-bottom: 1rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem; }
        h2 { font-size: 1.2rem; color: #333; margin-top: 0; }
        .options-container { margin: 1.5rem 0; }
        .option { display: block; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 8px; cursor: pointer; transition: background 0.2s; }
        .option:hover { background: #f0f7ff; }
        .option input { margin-right: 10px; }
        .controls { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
        .btn-reveal { background: #6c757d; color: white; }
        .btn-next { background: #007bff; color: white; }
        .btn-reveal:disabled { opacity: 0.5; cursor: not-allowed; }
        .correct-answer { margin-top: 15px; padding: 10px; background: #d4edda; color: #155724; border-radius: 6px; display: none; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz">
    <div class="header">
        <span id="counter">Question 0/0</span>
    </div>
    <div id="question-content">
        <h2 id="question-text">Loading...</h2>
        <div id="options" class="options-container"></div>
        <div id="feedback" class="correct-answer"></div>
    </div>
    <div class="controls">
        <button id="reveal-btn" class="btn-reveal" onclick="revealResponse()">Answer</button>
        <button id="next-btn" class="btn-next" onclick="nextQuestion()">Next</button>
    </div>
</div>

<script>
    let allQuestions = [];
    let currentIndex = 0;

    async function loadQuestions() {
        try {
            const response = await fetch('questions.json');
            const data = await response.json();
            allQuestions = data.sort(() => Math.random() - 0.5);
            renderQuestion();
        } catch (error) {
            document.getElementById('question-text').innerText = "Error JSON file could not be loaded";
            console.error(error);
        }
    }

    function renderQuestion() {
        if (currentIndex >= allQuestions.length) {
            showFinished();
            return;
        }

        const q = allQuestions[currentIndex];
        document.getElementById('counter').innerText = `Question ${currentIndex + 1}/${allQuestions.length}`;
        document.getElementById('question-text').innerText = q.question;
        document.getElementById('feedback').style.display = 'none';
        
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';

        q.options.forEach((opt, index) => {
            const label = document.createElement('label');
            label.className = 'option';
            const input = document.createElement('input');
            input.type = (q.type === 'checkbox') ? 'checkbox' : 'radio';
            input.name = 'quiz-option';
            input.value = opt;
            
            label.appendChild(input);
            label.appendChild(document.createTextNode(opt));
            optionsDiv.appendChild(label);
        });
    }

    function revealResponse() {
        const q = allQuestions[currentIndex];
        const feedback = document.getElementById('feedback');
        feedback.innerText = `Correct Answer: ${q.response}`;
        feedback.style.display = 'block';
    }

    function nextQuestion() {
        currentIndex++;
        renderQuestion();
    }

    function showFinished() {
        document.getElementById('question-content').innerHTML = "<h2>You rocked it!</h2>";
        document.getElementById('reveal-btn').classList.add('hidden');
        document.getElementById('next-btn').innerText = "Restart";
        document.getElementById('next-btn').onclick = () => location.reload();
    }

    loadQuestions();
</script>

</body>
</html>
